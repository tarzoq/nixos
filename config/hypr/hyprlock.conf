# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#inspiration battery and more: https://gist.github.com/ashish-kus/dd562b0bf5e8488a09e0b9c289f4574c
$font = Monospace

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = 0, 350
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo -e "$(/run/current-system/sw/bin/date +"%A, %d %B %Y")"
    font_size = 20
    font_family = $font

    position = 0, 240
    halign = center
    valign = center
}

# INPUT
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment if you wish to display a message during authentication
    check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# KBD LAYOUT
label {
    monitor =
    text = $LAYOUT[se, en]
    font_size = 24
    #onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
